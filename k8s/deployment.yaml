# Auto-generated Deployment by Bob
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: production
  labels:
    app: dashboard
    generated-by: bob
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
        version: v1
    spec:
      containers:
      - name: dashboard
        image: docker.io/gresesther/dashboard:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          protocol: TCP
        env:
        - name: PORT
          value: "5000"
        - name: ENVIRONMENT
          value: "production"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        livenessProbe:
